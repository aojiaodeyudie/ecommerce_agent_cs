# 电商客服配置
db_path: data/ecommerce.db            # SQLite 数据库文件（相对项目根）
refund_policy:                        # 退换货政策（阶段一先用规则文本，后续可迁入知识库）
  default: "支持7天无理由退货（未拆封不影响二次销售），15天质量问题换货，1年内保修。非质量问题退货，用户承担寄回运费；质量问题商家承担往返运费。"
  electronics: "电子产品支持7天无理由退货、15天换货、1年整机保修、核心部件3年保修。激活使用后无质量问题不支持无理由退货。"
  consumables: "耗材类（尘盒、滤网、边刷等）拆封后不支持无理由退货，质量问题7天内可换。"
escalate_keywords: ["人工", "投诉", "差评", "12315", "工商", "态度", "举报", "曝光"]   # 触发转人工的负面词
confirm_required_tools: ["create_after_sale", "update_address"]  # 需要二次确认的写操作工具
max_order_lookup_retry: 2             # 订单查询失败后允许追问的轮数上限

# ---- 意图路由配置（阶段二）----
# 分类器实现：rule（规则+关键词）| llm（纯模型）| hybrid（规则优先，低置信走LLM，推荐）
classifier_type: hybrid

# 意图规则：每个意图一组关键词，按 priority 顺序匹配（前者优先）
# 意图清单：escalate / refund / logistics / order / coupon / policy / faq /
#           product / knowledge / chitchat（chitchat 为兜底，无需规则）
intent_rules:
  escalate: ["人工", "投诉", "差评", "12315", "举报", "曝光", "态度", "工商", "维权"]
  refund: ["退货", "退款", "退换", "换货", "无理由", "运费险", "退款流程", "申请售后", "我要退"]
  logistics: ["物流", "快递", "到哪了", "配送", "签收", "运输", "转运", "派送", "快递单号", "运单"]
  order: ["订单", "发货", "下单", "购买记录", "待发货", "订单号", "我的单", "查单"]
  coupon: ["优惠", "优惠券", "券", "折扣", "满减", "促销", "活动", "领券", "减多少"]
  policy: ["发票", "开票", "保修", "质保", "三包", "政策", "售后多久", "几年"]
  faq: ["运费", "邮费", "包邮", "支付", "付款", "分期", "花呗", "白条", "客服几点", "上班时间", "多久回复", "怎么联系", "几点", "能用吗"]
  product: ["多少钱", "价格", "参数", "规格", "性能", "推荐", "哪款", "区别", "对比", "续航", "尺寸", "颜色", "型号", "有什么", "怎么样", "哪个好"]
  knowledge: ["怎么用", "如何使用", "故障", "报错", "保养", "清理", "安装", "维修", "坏了", "不工作", "设置", "教程", "说明书"]

# FAQ 直答开关：命中 FAQ 时直接返回答案，不经过 LLM/Agent
faq_direct_answer: true
